openapi: 3.0.3
components:
  schemas:
    CourseResource:
      required:
        - id
        - name
        - duration
        - level
        - category
      type: object
      description: Course data returned by the API.
      properties:
        id:
          type: string
          description: Unique course identifier.
          example: da2d455e-db3a-45ce-abfa-ee59a228b5f8
        name:
          type: string
          description: Name of the course.
          example: Introduction to Spring Boot
          maxLength: 200
          minLength: 1
        description:
          type: string
          description: Detailed description of the course content.
          example: Learn the fundamentals of building REST APIs with Spring Boot.
          maxLength: 1000
        duration:
          type: integer
          format: int32
          description: Total duration of the course, in hours.
          example: 12
          minimum: 1
        level:
          $ref: 'enum.yaml#/components/schemas/CourseLevel'
        category:
          $ref: 'enum.yaml#/components/schemas/CourseCategory'
