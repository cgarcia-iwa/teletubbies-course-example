openapi: 3.0.3
components:
  schemas:
    CourseResource:
      required:
        - id
        - name
        - duration
        - level
        - category
        - instructor
      type: object
      description: Course data returned by the API.
      properties:
        id:
          type: string
          description: Unique course identifier.
          example: da2d455e-db3a-45ce-abfa-ee59a228b5f8
        name:
          type: string
          description: Name of the course.
          example: Introduction to Spring Boot
          maxLength: 100
          minLength: 1
        description:
          type: string
          description: Detailed description of the course content.
          example: Learn the fundamentals of building REST APIs with Spring Boot.
          maxLength: 200
        duration:
          type: integer
          format: int32
          description: Total duration of the course, in hours.
          example: 12
          minimum: 1
        level:
          $ref: 'enum.yaml#/components/schemas/CourseLevel'
        category:
          $ref: 'enum.yaml#/components/schemas/CourseCategory'
        instructor:
          $ref: '#/components/schemas/InstructorResource'

    InstructorResource:
      required:
        - id
        - fullName
        - email
        - role
      type: object
      description: Instructor data returned by the API.
      properties:
        id:
          type: string
          description: Unique instructor identifier.
          example: da2d455e-db3a-45ce-abfa-ee59a228b5f8
        fullName:
          type: string
          description: Full name of the instructor.
          example: Laa-Laa
          maxLength: 150
          minLength: 1
        email:
          type: string
          format: email
          description: Contact email address of the instructor.
          example: laalaa@teletubbies.test
          maxLength: 150
          minLength: 1
        role:
          $ref: 'enum.yaml#/components/schemas/InstructorRole'
    PageResource:
      required:
        - number
        - size
      type: object
      description: Page details.
      properties:
        number:
          description: Current requested page.
          type: integer
          format: int32
        size:
          description: Number of items returned per page.
          type: integer
          format: int32

    CoursesData:
      required:
        - content
        - size
      type: object
      description: Wrapper containing the course list and its size.
      properties:
        content:
          description: List of courses for the requested page.
          type: array
          items:
            $ref: '#/components/schemas/CourseResource'
        size:
          description: Number of items included in the content list.
          type: integer
          format: int32

    CoursesPagedResources:
      required:
        - data
        - page
        - totalElements
      type: object
      description: Paginated courses response.
      properties:
        data:
          $ref: '#/components/schemas/CoursesData'
        page:
          $ref: '#/components/schemas/PageResource'
        totalElements:
          type: integer
          format: int64
          description: Total elements without pagination.

    InstructorsData:
      required:
        - content
        - size
      type: object
      description: Wrapper containing the instructor list and its size.
      properties:
        content:
          description: List of instructors for the requested page.
          type: array
          items:
            $ref: '#/components/schemas/InstructorResource'
        size:
          description: Number of items included in the content list.
          type: integer
          format: int32

    InstructorsPagedResources:
      required:
        - data
        - page
        - totalElements
      type: object
      description: Paginated instructors response.
      properties:
        data:
          $ref: '#/components/schemas/InstructorsData'
        page:
          $ref: '#/components/schemas/PageResource'
        totalElements:
          type: integer
          format: int64
          description: Total elements without pagination.
