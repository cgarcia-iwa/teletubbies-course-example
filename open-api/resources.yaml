openapi: 3.0.3
components:
  schemas:
    CourseResource:
      required:
        - id
        - name
        - duration
        - level
        - category
        - instructorId
      type: object
      description: Course data returned by the API.
      properties:
        id:
          type: string
          description: Unique course identifier.
          example: da2d455e-db3a-45ce-abfa-ee59a228b5f8
        name:
          type: string
          description: Name of the course.
          example: Introduction to Spring Boot
          maxLength: 100
          minLength: 1
        description:
          type: string
          description: Detailed description of the course content.
          example: Learn the fundamentals of building REST APIs with Spring Boot.
          maxLength: 200
        duration:
          type: integer
          format: int32
          description: Total duration of the course, in hours.
          example: 12
          minimum: 1
        level:
          $ref: 'enum.yaml#/components/schemas/CourseLevel'
        category:
          $ref: 'enum.yaml#/components/schemas/CourseCategory'
        instructorId:
          type: string
          description: Identifier of the instructor who teaches the course.
          example: da2d455e-db3a-45ce-abfa-ee59a228b5f8

    InstructorResource:
      required:
        - id
        - fullName
        - email
      type: object
      description: Instructor data returned by the API.
      properties:
        id:
          type: string
          description: Unique instructor identifier.
          example: da2d455e-db3a-45ce-abfa-ee59a228b5f8
        fullName:
          type: string
          description: Full name of the instructor.
          example: Laa-Laa
          maxLength: 150
          minLength: 1
        email:
          type: string
          format: email
          description: Contact email address of the instructor.
          example: laalaa@teletubbies.test
          maxLength: 150
