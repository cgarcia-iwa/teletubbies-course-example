openapi: 3.0.3
components:
  schemas:
    LoginRequest:
      type: object
      description: |
        Payload used to authenticate a user.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email address of the user.
          example: laalaa@teletubbies.test
          minLength: 1
          maxLength: 150
          x-field-extra-annotation: "@NotBlank"
        password:
          type: string
          format: password
          writeOnly: true
          description: Password of the user.
          example: s3cret-pass
          minLength: 8,
          maxLength: 20
          x-field-extra-annotation: "@NotBlank"

    NewCourseRequest:
      type: object
      description: |
        Payload used to create a new course.
      required:
        - name
        - duration
        - level
        - category
        - instructorId
      properties:
        name:
          type: string
          description: Name of the course.
          example: Introduction to Spring Boot
          maxLength: 100
          minLength: 1
          x-field-extra-annotation: "@NotBlank"
        description:
          type: string
          description: Detailed description of the course content.
          example: Learn the fundamentals of building REST APIs with Spring Boot.
          maxLength: 200
        duration:
          type: integer
          format: int32
          description: Total duration of the course, in hours.
          example: 12
          minimum: 1
        level:
          $ref: 'enum.yaml#/components/schemas/CourseLevel'
        category:
          $ref: 'enum.yaml#/components/schemas/CourseCategory'
        instructorId:
          type: string
          description: Identifier of the instructor who teaches the course.
          example: da2d455e-db3a-45ce-abfa-ee59a228b5f8
          maxLength: 36
          minLength: 1
          x-field-extra-annotation: "@NotBlank"

    UpdateCourseRequest:
      type: object
      description: |
        Payload used to update an existing course. All fields are replaced.
      required:
        - name
        - duration
        - level
        - category
        - instructorId
      properties:
        name:
          type: string
          description: Updated name of the course.
          example: Introduction to Spring Boot
          maxLength: 100
          minLength: 1
          x-field-extra-annotation: "@NotBlank"
        description:
          type: string
          description: Updated detailed description of the course content.
          example: Learn the fundamentals of building REST APIs with Spring Boot.
          maxLength: 200
        duration:
          type: integer
          format: int32
          description: Updated total duration of the course, in hours.
          example: 12
          minimum: 1
        level:
          $ref: 'enum.yaml#/components/schemas/CourseLevel'
        category:
          $ref: 'enum.yaml#/components/schemas/CourseCategory'
        instructorId:
          type: string
          description: Identifier of the instructor who teaches the course.
          example: da2d455e-db3a-45ce-abfa-ee59a228b5f8
          maxLength: 36
          minLength: 1
          x-field-extra-annotation: "@NotBlank"

    NewInstructorRequest:
      type: object
      description: |
        Payload used to create a new instructor.
      required:
        - fullName
        - email
      properties:
        fullName:
          type: string
          description: Full name of the instructor. Must be unique.
          example: Laa-Laa
          maxLength: 150
          minLength: 1
          x-field-extra-annotation: "@NotBlank"
        email:
          type: string
          format: email
          description: Contact email address of the instructor. Must be unique.
          example: laalaa@teletubbies.test
          maxLength: 150
          minLength: 1
          x-field-extra-annotation: "@NotBlank"
        password:
          type: string
          format: password
          writeOnly: true
          description: Initial password. If omitted, the instructor cannot log in.
          example: s3cret-pass
          minLength: 7
          maxLength: 12
        role:
          $ref: 'enum.yaml#/components/schemas/InstructorRole'

    UpdateInstructorRequest:
      type: object
      description: |
        Payload used to update an existing instructor. All fields are replaced.
      required:
        - fullName
        - email
      properties:
        fullName:
          type: string
          description: Updated full name of the instructor. Must be unique.
          example: Laa-Laa
          maxLength: 150
          minLength: 1
          x-field-extra-annotation: "@NotBlank"
        email:
          type: string
          format: email
          description: Updated contact email address of the instructor. Must be unique.
          example: laalaa@teletubbies.test
          maxLength: 150
          minLength: 1
          x-field-extra-annotation: "@NotBlank"
