spring:
  application:
    name: course
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: "000"
    baseline-on-migrate: true
    driver-class-name: org.postgresql.Driver
    user: ${MIGRATION_POSTGRES_USER:iwa}
    password: ${MIGRATION_POSTGRES_PASSWORD:demo}

logging:
  level:
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1h}

app:
  admin:
    full-name: ${ADMIN_FULL_NAME:Administrator}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
