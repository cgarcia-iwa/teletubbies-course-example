# **********************************************************************
# PostgreSQL configuration
# This configuration assumes PostgreSQL 17 or later.
# **********************************************************************

listen_addresses = '*'
port = 5432

# **********************************************************************
# File locations
# **********************************************************************
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

log_directory = '/var/lib/postgresql/data/log'
log_filename = 'postgresql.log'
logging_collector = off

# **********************************************************************
# Memory settings (roughly analogous to the MySQL InnoDB buffer pool)
# **********************************************************************
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
temp_buffers = 8MB

# **********************************************************************
# Connection settings
# **********************************************************************
max_connections = 500

# **********************************************************************
# Write-ahead log / durability settings
# **********************************************************************
wal_level = replica
synchronous_commit = off
max_wal_size = 1GB
min_wal_size = 80MB

# **********************************************************************
# Query / logging behavior
# **********************************************************************
log_min_duration_statement = 5000   # ms, analogous to long_query_time = 5
log_lock_waits = on

# **********************************************************************
# Locale / character set settings
# **********************************************************************
client_encoding = 'UTF8'
timezone = 'UTC'